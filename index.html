<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI STORE CHECKOUT SYSTEM</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="customerForm">
        <h1>MINI STORE CHECKOUT SYSTEM</h1>
        <div>
            <label for="customerName">Customer Name: </label>
            <input type="text" id="customerName" placeholder="Enter your name here..." required><br><br>
        </div>
        <div>
            <label for="productCount">Number of Products: </label>
            <input type="number" id="productCount" placeholder="Enter number of products here..." min="1"
                required><br><br>
        </div>
        
        <button type="button" id="insertProducts">Insert Products</button>

        <div id="productsContainer"></div>

        <br>

        <div>
            <label for="deliveryOption">Delivery Option:</label>
            <select id="deliveryOption" required>
                <option value="1">Self Pickup ₱0</option>
                <option value="2">Standard Delivery ₱80</option>
                <option value="3">Express Delivery ₱150</option>
            </select>
        </div>

        <br>

        <button type="button" id="calculateBtn">Calculate Order</button>

        <p id="validationMessage"></p>
    </form>
    <br><br>
    <div id="orderSummary">
        <h2>Order Summary</h2>
    </div>

</body>

</html>
